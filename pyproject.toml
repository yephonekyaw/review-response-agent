[project]
name = "response-agent"
version = "0.1.0"
description = "AI agent that drafts point-by-point rebuttals to manuscript reviewer comments."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3.0",
    "fpdf2>=2.7",
    "gradio>=4.44",
    "markdown>=3.6",
    "numpy>=1.26",
    "ollama>=0.4.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/response_agent"]
